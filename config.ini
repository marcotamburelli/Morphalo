[huggingface]
# Uncomment to keep all Hugging Face state for this project under ./hf_cache.
# If unset, Hugging Face uses its default location, usually ~/.cache/huggingface.
# hf_home=hf_cache

# Uncomment to keep downloaded Hub repositories under this project.
# If unset, Hugging Face uses $HF_HOME/hub, or its default hub cache.
# hf_hub_cache=hf_cache/hub

# Set to 1 to disable Hugging Face telemetry from compatible libraries.
disable_telemetry=1

# Set to 1 to force offline mode. Cached files are reused; missing files fail.
offline=0

[morphalo]
# Maximum CUDA nodes executed by one worker process before recycling it.
cuda_chunk_size=8
