include "../common.conf"

prompt {
  content = [
    "half-body photo of a red-haired woman, symmetrical face, natural freckles, soft makeup",
    "walking by a swimming pool at a luxury Mediterranean villa, stone tiles, water reflections, light breeze"
  ]
  style = [
    "cinematic high-fashion editorial, golden hour daylight, soft light",
    "85mm lens, shallow depth of field, ultra-detailed"
  ]
}

negative_prompt {
  content = [
    ${defaults.negative_prompt},
    "extra fingers, extra limbs, deformed face, bad anatomy"
  ]
  style = [
    "overexposed, harsh shadows, low contrast"
  ]
}

params {
  steps = 32
  cfg = 6.0
  width = 1024
  height = 1024
}

seed = random
