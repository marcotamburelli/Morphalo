# --- LTX Image-to-Video (standalone) ---

model = {
  id = "Lightricks/LTX-Video-0.9.7-dev"
  upscaler = "Lightricks/ltxv-spatial-upscaler-0.9.7"
  device = "cuda"
  dtype = "bf16"
}

input = {
  # path locale o URL
  image = "outputs/keyframe.png"
  frame_index = 0
}

prompt = [
  "cinematic close-up portrait, soft rim light",
  "subtle head turn, blink, hair moving in wind",
  "slow dolly-in, shallow depth of field, film grain"
]

negative_prompt = [
  "worst quality",
  "inconsistent motion",
  "blurry",
  "jittery",
  "distorted",
  "face warping"
]

# seed = 0
out = "outputs/ltx_i2v_portrait.mp4"

params = {
  width = 768
  height = 768
  fps = 24
  num_frames = 120

  steps_main = 30
  steps_refine = 10
  denoise_strength = 0.4
  downscale_factor = 0.6666667
  upscale_latent_factor = 2

  # LTX 0.9.1+ recommended defaults
  decode_timestep = 0.05
  image_cond_noise_scale = 0.025
}
