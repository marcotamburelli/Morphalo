# ------------------------------------------------------------
# Preprocessing / rendering
# ------------------------------------------------------------

# Render edges on top of the original frame (debug only).
# Recommended: false for control inputs.
preserve_bg = false

# Downscale output so that the longest side equals this value.
# Use null to disable resizing.
long_side = 384

# Process only the first N frames.
# Use -1 to process the full video.
max_frames = -1


# ------------------------------------------------------------
# Canny configuration
# ------------------------------------------------------------

# Lower hysteresis threshold
low_threshold = 80

# Upper hysteresis threshold
high_threshold = 160

# Sobel aperture size used by Canny (3, 5, or 7)
aperture_size = 3

# Use L2 norm for gradient magnitude (more precise, slightly slower)
l2_gradient = false

# Gaussian blur before Canny to reduce noise.
# Use 0 or 1 to disable.
blur_ksize = 5

# Gaussian sigma for blur (0 lets OpenCV choose automatically)
blur_sigma = 0.0

# Morphological dilation after Canny (thickens edges).
# Set to 0 to disable.
dilate = 0
dilate_iter = 1

# Invert final edge map (white background, black edges)
invert = false


# ------------------------------------------------------------
# Output encoding
# ------------------------------------------------------------

# Override output FPS.
# If not defined, the input video FPS is used.
#   fps = null
