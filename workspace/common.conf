model {
  kind = sdxl_single_file
  path = ~/models/juggernaut/juggernautXL_ragnarokBy.safetensors
  dtype = bf16
  device = cuda
}

defaults {
  negative_prompt = """
  lowres, blurry, artifacts, extra fingers,
  deformed anatomy, bad proportions
  """
}

params {
  steps = 30
  cfg = 6.0
  width = 1024
  height = 1024
}

seed = random
